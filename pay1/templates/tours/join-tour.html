{% extends "base.html" %}
{% load static %}

{% block title %}Join a Tour{% endblock %}

{% block content %}
<div class="min-h-screen bg-slate-50 px-4 py-12">
    <main class="mx-auto max-w-md rounded-2xl border border-slate-200 bg-white p-8 shadow-xl shadow-slate-200/60">
        <a href="/dashboard/" class="text-sm font-semibold text-blue-600 hover:text-blue-700">&larr; Dashboard</a>
        <p class="mt-8 text-sm font-bold uppercase tracking-[.18em] text-blue-600">PayTogether</p>
        <h1 class="mt-2 text-3xl font-bold text-slate-900">Join a tour</h1>
        <p class="mt-3 text-slate-600">Ask the tour organizer for their eight-character join code.</p>

        <form id="joinTourForm" class="mt-8 space-y-5" novalidate>
            <div>
                <label for="joinCode" class="text-sm font-semibold text-slate-700">Join code</label>
                <input id="joinCode" name="join_code" type="text" maxlength="8" autocomplete="off" required autofocus placeholder="e.g. AB12CD34" class="mt-2 block w-full rounded-xl border border-slate-300 px-4 py-3 font-mono text-lg uppercase tracking-[.2em] text-slate-900 outline-none focus:border-blue-500 focus:ring-4 focus:ring-blue-100">
            </div>
            <p id="joinMessage" class="hidden text-sm font-medium" role="alert" aria-live="polite"></p>
            <button id="joinSubmit" type="submit" class="w-full rounded-xl bg-blue-600 px-5 py-3 font-semibold text-white transition hover:bg-blue-700 disabled:cursor-not-allowed disabled:opacity-60">Join tour</button>
        </form>
    </main>
</div>
{% endblock %}

{% block scripts %}
<script src="{% static 'js/join-tour.js' %}"></script>
{% endblock %}
